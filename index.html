<style>
:root{color-scheme:light}
[hidden]{display:none!important}
/* Layout: one-column phone app. Header with week + title, three fixed bottom tabs (Squad, Training, Teams),
   bottom sheets for player detail, import and settings. Pitch-green accent; bib colours only on team cards. */
:root{
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#F1F4EC; --surface:#FFFFFF; --surface2:#E7ECDF; --fg:#16231B; --muted:#586A5E; --line:#D3DAC9;
  --accent:#17613A; --on-accent:#FFFFFF; --accent-soft:#DCEBDD; --danger:#B3261E; --warn:#B87900;
  --t0:#D9480F; --t0-on:#FFFFFF; --t1:#1C6DD0; --t1-on:#FFFFFF; --t2:#E3B505; --t2-on:#1A1A12; --t3:#7B3FBF; --t3-on:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1411; --surface:#16201A; --surface2:#1F2C24; --fg:#E7EEE9; --muted:#95A89B; --line:#2C3B32;
    --accent:#5CCB8C; --on-accent:#08200F; --accent-soft:#1B3526; --danger:#F0877F; --warn:#E3B04A;
    --t0:#F07A32; --t0-on:#16120E; --t1:#6AA3F2; --t1-on:#0C1626; --t2:#EBC83F; --t2-on:#1A1A12; --t3:#B38AE8; --t3-on:#170F24;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#16201A; --surface2:#1F2C24; --fg:#E7EEE9; --muted:#95A89B; --line:#2C3B32;
  --accent:#5CCB8C; --on-accent:#08200F; --accent-soft:#1B3526; --danger:#F0877F; --warn:#E3B04A;
  --t0:#F07A32; --t0-on:#16120E; --t1:#6AA3F2; --t1-on:#0C1626; --t2:#EBC83F; --t2-on:#1A1A12; --t3:#B38AE8; --t3-on:#170F24;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--body); font-size:16px; line-height:1.45;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(88px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
body.lock{overflow:hidden}
.wrap{max-width:640px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.tt{min-width:0}
.eyebrow{margin:0 0 2px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.status.warn::before{background:var(--warn)}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.ibtn svg,.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* generic */
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.hint{margin:0;font-size:14px;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:10px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted)}
input[type=text],input[type=date],textarea{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
textarea{resize:vertical;line-height:1.4}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:38px;border:0;background:transparent;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.cnt{font-size:14px;color:var(--muted);margin:0}

/* squad list */
.addrow{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.addrow input{min-width:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prow{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto 38px;align-items:center;gap:12px;padding:10px 14px;min-height:60px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.list > :first-child{border-top:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.03em}
.pm{display:flex;flex-direction:column;min-width:0}
.pn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps{font-size:13px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:2px;height:22px}
.bars i{display:block;width:4px;border-radius:1px;background:var(--line)}
.bars i.on{background:var(--accent)}
.ov{font-family:var(--display);font-weight:700;font-size:24px;text-align:right;font-variant-numeric:tabular-nums}

/* training */
.focus{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ftxt{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.15}
.daterow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.counter{display:flex;justify-content:space-between;align-items:center;gap:8px}
.counter b{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.counter span{color:var(--muted)}
.arow{width:100%;display:grid;grid-template-columns:32px minmax(0,1fr);align-items:center;gap:12px;padding:10px 14px;min-height:56px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;font-weight:500}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.box svg{width:18px;height:18px;fill:none;stroke:var(--on-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.arow.on{background:var(--accent-soft)}
.arow.on .box{background:var(--accent);border-color:var(--accent)}
.arow.on .box svg{opacity:1}

/* teams */
.controls{display:flex;flex-direction:column;gap:8px}
.teams{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.team{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.team-h{background:var(--tc);color:var(--tc-on);padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.team-h b{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;line-height:1.1}
.team-h span{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.tp{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px;padding:8px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.team-h + .tp{border-top:0}
.tp .tr{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}

/* sheets */
#sheet-root{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(8,16,11,.55)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.phead h2{margin:0;font-family:var(--display);font-weight:700;font-size:28px;text-transform:uppercase;line-height:1.1}
.x{width:44px;height:44px;border:0;background:transparent;font-size:30px;line-height:1;color:var(--muted)}
.pbody{overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.skill{display:flex;flex-direction:column;gap:6px}
.sk-l{font-weight:600;font-size:15px}
.rbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rb{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:700;font-size:20px}
.rb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ovline{display:flex;align-items:baseline;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.ovbig{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabin{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{min-height:56px;border:0;background:transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

@media (prefers-reduced-motion: reduce){.panel{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="tt"><p class="eyebrow" id="wk"></p><h1 id="ttl">Squad</h1></div>
    <div class="tools">
      <span class="status" id="status">Saved on this phone</span>
      <button class="ibtn" id="settings" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 12h3M13 12h7M4 17h11M21 17h-1"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="18" cy="17" r="2.2"/></svg>
      </button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="tabin">
  <button class="tab" type="button" data-tab="squad"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14c2.6.1 4.5 1.9 4.5 4.5"/></svg>Squad</button>
  <button class="tab" type="button" data-tab="train"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 13l2 2 4-4"/></svg>Training</button>
  <button class="tab" type="button" data-tab="teams"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>Teams</button>
</div></nav>

<div id="sheet-root" hidden></div>

<script>
(function(){
'use strict';

var LS='coachs-clipboard-v1';
var SKILLS=[['handling','Handling'],['tackle','Contact & tackle'],['ruck','Ruck'],['kicking','Kicking'],['defence','Defence'],['aware','Game awareness']];
var BIBS=['Orange','Blue','Yellow','Purple'];
var TOTAL_WEEKS=30;
/* Same phases and weekly focus rotation as the Weekly Planner tab in the season workbook. */
var PLAN=[
  ['Pre-Season',1,4,['Fitness base & running mechanics','Passing & catching fundamentals','Contact confidence (tackle technique)','Ball presentation & support play']],
  ['Early Season',5,12,['Tackle technique (chop/dominant)','Passing under pressure','Ruck arrival & body position','Alignment & running lines','Kick-pass & chase','Defensive line speed','Handling in contact (offload)','Set piece basics (scrum/lineout)']],
  ['Mid-Season',13,22,['Decision-making: pass/carry/kick','Breakdown speed & jackal','Attacking shape & width','Defensive systems (drift/blitz)','Set piece variations','Game management & territory','Support lines & continuity','Counter-attack','Discipline & game awareness','Fitness & conditioning top-up']],
  ['Late Season',23,27,['Team patterns & structure','Tactical kicking','Closing out tight games','Set piece precision','Unit combinations']],
  ['Finals / Peak',28,30,['Freshness & tapering','Mental preparation','Set piece execution','Game plan clarity']]
];
var TITLES={squad:'Squad',train:'Training',teams:'Teams'};
var CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function h(tag,props){
  var e=document.createElement(tag);
  props=props||{};
  for(var k in props){
    var v=props[k];
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  var kids=[].slice.call(arguments,2);
  [].concat.apply([],kids).forEach(function(c){
    if(c==null||c===false)return;
    e.append(c.nodeType?c:document.createTextNode(c));
  });
  return e;
}
function btn(t,fn,cls){return h('button',{type:'button','class':'btn '+(cls||''),onclick:fn},t);}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYmd(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function dayDiff(a,b){return Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/864e5);}
function uid(){return 'p'+Math.random().toString(36).slice(2,9);}
function initials(n){var w=(n||'?').trim().split(/\s+/);return ((w[0]||'?')[0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase();}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- state ---------- */
function exampleState(){
  var names=['Aoife','Cian','Niamh','Seán','Fionn','Saoirse','Oisín','Ciara','Darragh','Aisling','Conor','Éabha','Liam','Róisín','Tadhg','Sophie'];
  var players=names.map(function(n,i){
    var r={};SKILLS.forEach(function(s,j){r[s[0]]=((i*7+j*3+(i>>1))%5)+1;});
    return {id:'ex'+i,name:n,r:r,note:''};
  });
  var sessions={},today=new Date();
  [0,7,14].forEach(function(back,s){
    var d=new Date(today);d.setDate(d.getDate()-back);
    sessions[ymd(d)]=players.filter(function(p,i){return (i*5+s*3)%7!==0;}).map(function(p){return p.id;});
  });
  return {v:1,updated:0,lastBackup:0,examples:true,seasonStart:'2026-09-07',players:players,sessions:sessions,teams:null};
}
function normalize(d){
  return {
    v:1,updated:+d.updated||0,lastBackup:+d.lastBackup||0,examples:!!d.examples,seasonStart:d.seasonStart||'2026-09-07',
    players:Array.isArray(d.players)?d.players.map(function(p){return {id:String(p.id),name:String(p.name||''),r:Object.assign({},p.r),note:String(p.note||'')};}):[],
    sessions:(d.sessions&&typeof d.sessions==='object')?d.sessions:{},
    teams:d.teams||null
  };
}
function loadLocal(){try{var s=localStorage.getItem(LS);return s?normalize(JSON.parse(s)):null;}catch(e){return null;}}

/* ---------- saving: this phone always, account when available ---------- */
var sync={status:'local',ref:null,busy:false,pending:false,timer:null};
var persistAsked=false;
function persist(){
  if(!persistAsked){persistAsked=true;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}}
  state.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  queueRemote();
  renderStatus();
}
function queueRemote(){
  if(!sync.ref)return;
  sync.status='saving';
  clearTimeout(sync.timer);
  sync.timer=setTimeout(flush,700);
}
function flush(){
  if(sync.busy){sync.pending=true;return;}
  sync.busy=true;
  Promise.resolve().then(function(){return sync.ref.set(JSON.parse(JSON.stringify(state)));})
    .then(function(){sync.status='saved';})
    .catch(function(){sync.status='local';})
    .then(function(){
      sync.busy=false;
      if(sync.pending){sync.pending=false;queueRemote();}
      renderStatus();
    });
}
function renderStatus(){
  var s=$('status');if(!s)return;
  var map={saved:['Saved',false],saving:['Saving…',false],local:['Saved on this phone',false]};
  var m=map[sync.status]||map.local;
  s.textContent=m[0];s.className='status'+(m[1]?' warn':'');
}
function initRemote(){
  if(!(window.claude&&window.claude.use))return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)return null;
    return user.id().then(function(id){
      if(!id)return null;
      sync.ref=db.doc('data/users/'+id+'/squad');
      sync.ref.onSnapshot(function(snap){
        if(snap.metadata.hasPendingWrites)return;
        var d=snap.exists?snap.data():null;
        var remoteAt=d&&typeof d.updated==='number'?d.updated:0;
        if(d&&remoteAt>state.updated){
          state=normalize(d);
          try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
          sync.status='saved';
          renderAll();
        }else if(state.updated>remoteAt){
          queueRemote();
        }else{
          sync.status='saved';
        }
        renderStatus();
      },function(){sync.status='local';renderStatus();});
    });
  }).catch(function(){});
}

/* ---------- teams ---------- */
function makeTeams(ids,n,mode){
  var assign={};
  if(mode==='random'){shuffle(ids).forEach(function(id,i){assign[id]=i%n;});return assign;}
  var cap=Math.ceil(ids.length/n),sums=[],cnt=[],t;
  for(t=0;t<n;t++){sums.push(0);cnt.push(0);}
  ids.map(function(id){var s=score(byId(id));return {id:id,s:s,j:s+(Math.random()-0.5)*0.8};})
    .sort(function(a,b){return b.j-a.j;})
    .forEach(function(p){
      var best=-1;
      for(t=0;t<n;t++){
        if(cnt[t]>=cap)continue;
        if(best<0||sums[t]<sums[best]-1e-9||(Math.abs(sums[t]-sums[best])<1e-9&&Math.random()<0.5))best=t;
      }
      assign[p.id]=best;sums[best]+=p.s;cnt[best]++;
    });
  return assign;
}
function teamKey(ids,n){return ids.slice().sort().join(',')+'|'+n;}
function ensureTeams(ids){
  if(!state.teams)state.teams={n:2,mode:'balanced',key:'',assign:{}};
  var t=state.teams;
  if(t.n>ids.length)t.n=Math.max(2,Math.min(4,ids.length));
  var key=teamKey(ids,t.n);
  if(t.key!==key){t.assign=makeTeams(ids,t.n,t.mode);t.key=key;persist();}
  return t;
}
function reshuffle(ids){var t=state.teams;t.assign=makeTeams(ids,t.n,t.mode);t.key=teamKey(ids,t.n);persist();renderAll();}

/* ---------- import / settings ---------- */
function parseTable(text){
  var delim=text.indexOf('\t')>=0?'\t':',',rows=[],row=[],cell='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"'&&cell==='')q=true;
    else if(c===delim){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';rows.push(row);row=[];}
    else cell+=c;
  }
  row.push(cell);rows.push(row);
  return rows.map(function(r){return r.map(function(x){return x.trim();});}).filter(function(r){return r.some(function(x){return x;});});
}
function parseImport(text){
  var rows=parseTable(text);if(!rows.length)return [];
  var first=rows[0].map(function(x){return x.toLowerCase();});
  var ni=first.findIndex(function(x){return ['name','player','players','first name','player name'].indexOf(x)>=0;});
  var start=0,map=null,noteI=-1;
  if(ni>=0){
    start=1;map={};
    var alias={handling:'handling',tackle:'tackle',contact:'tackle','contact & tackle':'tackle',ruck:'ruck',kicking:'kicking',defence:'defence',awareness:'aware','game awareness':'aware',aware:'aware'};
    first.forEach(function(c,i){if(alias[c])map[alias[c]]=i;});
    noteI=first.indexOf('notes');
  }else ni=0;
  var out=[],seen={};
  for(var i=start;i<rows.length;i++){
    var r=rows[i],name=(r[ni]||'').trim();
    if(!name||seen[name.toLowerCase()])continue;
    seen[name.toLowerCase()]=1;
    var rr={};
    if(map)for(var k in map){var v=parseInt(r[map[k]],10);if(v>=1&&v<=5)rr[k]=v;}
    out.push({name:name,r:rr,note:noteI>=0?(r[noteI]||''):''});
  }
  return out;
}

function saveBackup(b,cb){
  var json=JSON.stringify(state,null,1),name='coachs-clipboard-backup-'+ymd(new Date())+'.json';
  function done(){state.lastBackup=Date.now();persist();if(cb)cb();else flash(b,'Backup saved');}
  function viaLink(){
    var url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    var a=h('a',{href:url,download:name});
    document.body.append(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
    done();
  }
  try{
    var file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Coach’s Clipboard backup'}).then(done,function(e){if(!e||e.name!=='AbortError')viaLink();});
      return;
    }
  }catch(e){}
  viaLink();
}
function openSettings(){
  var d=h('input',{id:'set-start',type:'date',value:state.seasonStart,'aria-label':'Season start date',
    onchange:function(e){if(parseYmd(e.target.value)){state.seasonStart=e.target.value;persist();renderAll();}}});
  var save=h('button',{'class':'btn primary',type:'button'},'Save backup file');
  save.addEventListener('click',function(){saveBackup(save);});
  var fi=h('input',{type:'file',id:'restore-file',accept:'.json,application/json','aria-label':'Choose backup file',style:'position:absolute;left:-9999px;width:1px;height:1px;opacity:0'});
  var pick=h('button',{'class':'btn',type:'button'},'Restore from backup file');
  pick.addEventListener('click',function(){fi.click();});
  var rinfo=h('p',{'class':'hint'});
  var rgo=h('button',{'class':'btn danger',type:'button',hidden:true},'Replace my squad with this backup');
  var pending=null;
  fi.addEventListener('change',function(){
    var f=fi.files&&fi.files[0];if(!f)return;
    f.text().then(function(t){
      var j=JSON.parse(t);
      if(!j||!Array.isArray(j.players))throw new Error('bad');
      pending=normalize(j);pending.examples=false;
      var n=pending.players.length;
      rinfo.textContent='This backup has '+n+(n===1?' player':' players')+' and '+Object.keys(pending.sessions).length+' logged sessions. Restoring replaces what is on this phone now.';
      rgo.hidden=false;
    }).catch(function(){pending=null;rgo.hidden=true;rinfo.textContent='That file isn’t a Coach’s Clipboard backup.';});
    fi.value='';
  });
  rgo.addEventListener('click',function(){
    if(!pending)return;
    state=pending;state.lastBackup=Date.now();persist();closeSheet();
  });
  var prot=h('p',{'class':'hint'});
  if(navigator.storage&&navigator.storage.persisted){
    navigator.storage.persisted().then(function(ok){
      prot.textContent=ok?'The browser has marked this data as protected from automatic clearing.':'The browser may clear this data if the phone runs low on space or you stop using the app for a while. A backup file is the safe fix.';
    },function(){});
  }
  var copy=h('button',{'class':'btn',type:'button'},'Copy squad as CSV');
  copy.addEventListener('click',function(){copyText(toCSV(),copy);});
  var clr=h('button',{'class':'btn danger',type:'button'},'Clear all players and sessions');
  clr.addEventListener('click',function(){
    if(!clr.dataset.arm){clr.dataset.arm='1';clr.textContent='Tap again to clear everything';return;}
    wipeExamples();persist();closeSheet();
  });
  openSettings_sheet();
  function openSettings_sheet(){
    openSheet('Settings',h('div',{'class':'stack'},
      h('div',{'class':'field'},h('label',{'for':'set-start','class':'lbl',text:'Season start (Monday of week 1)'}),d,
        h('p',{'class':'hint',text:'Sets the week number and weekly focus, which follow the 30-week plan in the season workbook.'})),
      h('div',{'class':'field'},h('span',{'class':'lbl',text:'Backup'}),save,
        h('p',{'class':'hint',text:'Last backup: '+fmtDate(state.lastBackup)+'. Keep the file in Files, iCloud Drive, or email it to yourself.'}),
        pick,fi,rinfo,rgo,prot),
      h('div',{'class':'field'},h('span',{'class':'lbl',text:'Spreadsheet'}),copy,
        h('p',{'class':'hint',text:'Copies names, ratings, notes and attendance so you can paste them into a spreadsheet.'})),
      clr),function(){renderAll();});
  }
}

/* ---------- shell ---------- */
function gotoTab(t){
  if(!TITLES[t])return;
  ui.tab=t;
  try{location.hash=t;}catch(e){}
  renderAll();window.scrollTo(0,0);
}
function renderAll(){
  var wi=weekInfo();
  $('wk').textContent=wi?wi.label:'';
  $('ttl').textContent=TITLES[ui.tab];
  [].forEach.call(document.querySelectorAll('.tab'),function(b){b.setAttribute('aria-current',b.dataset.tab===ui.tab?'page':'false');});
  var views={squad:viewSquad,train:viewTrain,teams:viewTeams};
  $('view').replaceChildren(views[ui.tab]());
  renderStatus();
}
[].forEach.call(document.querySelectorAll('.tab'),function(b){b.addEventListener('click',function(){gotoTab(b.dataset.tab);});});
$('settings').addEventListener('click',openSettings);
window.addEventListener('hashchange',function(){
  var t=location.hash.slice(1);
  if(TITLES[t]&&t!==ui.tab){ui.tab=t;renderAll();window.scrollTo(0,0);}
});

renderAll();
})();
</script>
